spring.application.name=spring-security-jwt-mysql
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/securitydb?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Use a strong random value in real environments.
# Minimum 32 characters for this HS256 key.
jwt.secret=${JWT_SECRET:change-this-development-secret-key-32chars}
jwt.expiration=${JWT_EXPIRATION:86400000}

spring.jpa.open-in-view=false
